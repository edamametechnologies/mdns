[package]
name = "wez-mdns"
version = "0.1.2"
edition = "2021"
license = "MIT/Apache-2.0"
readme = "README.md"
keywords = ["mdns", "discovery", "home-automation"]
categories = ["parser-implementations", "network-programming"]
authors = ["Wez Furlong <wez@wezfurlong.org>", "Paul Colomiets <paul@colomiets.name>"]
repository = "https://github.com/wez/mdns"
description = "Robust mDNS implementation for home automation"
documentation = "https://docs.rs/wez-mdns"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
with-serde = ["serde"]

[dependencies]
byteorder = "1"
if-addrs = "0.13"
log = "0.4"
rand = "0.8"
serde = { version = "1.0", optional = true, features = ["derive"]}
# Bumped from "1.3" to "2" in 2026-05 to drop the transitive
# rustix 0.37.28 dependency, which uses unstable `rustc_attrs` cfg
# names that newer rustc rejects (breaking edamame_foundation CI on
# Linux + Windows on the May-04 nightly). smol 2.x's surface
# (channel::bounded, net::UdpSocket, Async::new, spawn, Timer::at)
# is identical to 1.3 for everything this crate uses.
smol = "2"
socket2 = {version="0.5", features=["all"]}
thiserror = "1.0"

[dev-dependencies]
clap = {version="4.4", features=["derive"]}
k9 = "0.11"
